<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bunyala eFootball Gamers</title>

<style>
body{
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

img{
    width:250px;
}

.loader{
    width:300px;
    height:8px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.progress{
    width:0%;
    height:100%;
    background:#1e90ff;
    border-radius:20px;
}
</style>
</head>

<body>

<img src="logo.png">

<div class="loader">
    <div class="progress"></div>
</div>

<script>
let progress = document.querySelector(".progress");

let width = 0;

let interval = setInterval(() => {

    width += 1;

    progress.style.width = width + "%";

    if(width >= 100){
        clearInterval(interval);
        window.location.href = "home.html";
    }

}, 30);
</script>

</body>
</html>
